    <style>
         :root {
            --pink: #3f0033;
            --navy: #091433;
            --blue-dark: #0b3c88;
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(90deg, #0f2340 35%, var(--pink) 35%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        /* ===== HEADER / NAVIGATION STYLES - MODIFIED ===== */
        
        header {
            display: flex;
            /* توسيط العناصر داخله */
            justify-content: center;
            gap: 28px;
            padding: 28px 48px;
            align-items: center
        }
        
        nav {
            display: flex;
            gap: 28px;
            /* إزالة خاصية margin-left: auto; لتوسيط القائمة */
            animation: dropDown 0.7s ease-out;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            opacity: 0.95;
            transition: 0.3s ease;
            position: relative;
        }
        
        nav a.active {
            border-bottom: 3px solid #7ce0ff;
            padding-bottom: 4px;
            transition: 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
        }
        
        nav a:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25)
        }
        
        @keyframes dropDown {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        /* ===== LAYOUT ===== */
        
        .container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            padding: 20px 48px
        }
        /* ===== LEFT SECTION (Video/Content) ===== */
        
        .left {
            background: var(--navy);
            width: 66%;
            height: auto;
            min-height: 72vh;
            border-radius: 0 80px 80px 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            padding: 48px;
            position: relative;
            overflow: hidden
        }
        
        .left .frame {
            width: 70%;
            min-width: 420px;
            background: #f0f3f7;
            padding: 18px;
            border-radius: 6px;
            margin: 40px auto;
            box-shadow: 16px 18px 30px rgba(0, 0, 0, 0.4);
            aspect-ratio: 16/9;
            height: auto;
            overflow: hidden;
            color: var(--navy);
        }
        
        .left .frame h2 {
            margin-top: 0;
            color: var(--pink);
        }
        /* Style for video inside the frame */
        
        .left .frame video {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 4px;
        }
        /* Style for text content inside the frame */
        
        .left .frame .content-display {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }
        
        .caption {
            color: #ffffff;
            background: transparent;
            padding: 18px 10px;
            text-align: center;
            font-weight: 700;
            margin-top: 8px
        }
        
        .left .decor-vertical {
            position: absolute;
            left: 20px;
            top: 40%;
            width: 8px;
            height: 120px;
            background: #fff;
            opacity: 0.9;
            border-radius: 4px
        }
        
        .left .dots {
            position: absolute;
            right: 28px;
            top: 28px;
            display: grid;
            grid-template-columns: repeat(5, 8px);
            gap: 8px;
            opacity: 0.18
        }
        
        .left .dots span {
            width: 6px;
            height: 6px;
            background: #9fb3d6;
            border-radius: 50%
        }
        /* ===== RIGHT SECTION (Buttons) ===== */
        
        .right {
            width: 34%;
            height: auto;
            padding: 80px 48px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px
        }
        
        .module {
            width: 100%;
            max-width: 300px;
            text-align: center;
        }
        
        .btn {
            width: 95%;
            max-width: 300px;
            padding: 20px 22px;
            border-radius: 32px;
            text-align: center;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.15rem;
            box-shadow: inset 10px 10px 20px rgba(0, 0, 0, 0.15);
            background: linear-gradient(90deg, #0f2340, #e89ccf);
            color: #fff;
            transition: all .25s ease;
        }
        
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        /* DROPDOWN MENU */
        
        .dropdown {
            margin-top: 10px;
            background: #0f2340;
            padding: 10px;
            border-radius: 18px;
            display: none;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
        }
        
        .sub-btn {
            width: 100%;
            margin: 6px 0;
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ffb7d9, #7a57ff);
            font-weight: 700;
            font-size: 1rem;
            color: #0f2340;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        
        .sub-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        .module.active .dropdown {
            display: block;
            max-height: 200px;
            padding: 10px;
        }
        
        .arrows-top {
            position: absolute;
            left: 18px;
            top: 18px;
            color: #fff;
            opacity: 0.85
        }
        /* ===== RESPONSIVE ===== */
        
        @media (max-width:1000px) {
            body {
                background: linear-gradient(180deg, var(--pink) 36%, #0f2340 36%)
            }
            /* توسيط العنوان على الشاشات الصغيرة */
            header {
                justify-content: center;
            }
            .container {
                flex-direction: column;
                align-items: stretch
            }
            .left,
            .right {
                width: 100%;
                border-radius: 20px;
                height: auto;
                min-height: auto;
            }
            .left .frame {
                width: 92%;
                min-width: auto
            }
        }
    </style>
</head>

        const frame = document.getElementById("frame");
        const video = document.getElementById("mainVideo");
        const source = document.getElementById("videoSrc");
        const caption = document.getElementById("videoTitle");
        const contentDisplay = document.getElementById("contentDisplay");

        // Function to show the video player and hide the text content
        function showVideoPlayer(fileName, title) {
            video.style.display = 'block';
            contentDisplay.style.display = 'none';
            source.src = fileName;
            caption.textContent = title;
            video.load();
            video.play();
        }

        // Function to show the text content and hide the video player
        function showTextContent(htmlContent, title) {
            video.pause(); // إيقاف تشغيل الفيديو عند عرض المحتوى النصي
            video.style.display = 'none';
            contentDisplay.style.display = 'block';
            contentDisplay.innerHTML = htmlContent;
            caption.textContent = title;
        }

        // 1. Module Button Click Handler (Handles dropdown toggle and video loading)
        document.querySelectorAll(".module-btn").forEach(btn => {
            btn.onclick = () => {
                const m = btn.parentElement;

                // Toggle dropdown state
                document.querySelectorAll(".module").forEach(x => {
                    if (x !== m) x.classList.remove("active");
                });
                m.classList.toggle("active");

                // Load the default video for the module when button is clicked
                const videoFile = btn.getAttribute("data-video");
                const videoTitle = btn.getAttribute("data-title");
                showVideoPlayer(videoFile, videoTitle);
            }
